---
layout: default
---

<main id="main" class="writing-site writing-article">
  <a class="writing-back" href="{{ '/articles/' | relative_url }}">← All articles</a>
  <header class="writing-article__header">
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="writing-article__body">{{ content }}</div>
  <footer class="writing-article__footer">
    <a href="{{ '/articles/' | relative_url }}">← All articles</a>
  </footer>
</main>
