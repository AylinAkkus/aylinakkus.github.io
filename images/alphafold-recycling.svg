<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="title desc">
  <title id="title">AlphaFold 2 recycling</title>
  <desc id="desc">Input passes through the same AlphaFold 2 network to produce a structure. Representations and structure are recycled into the input for another pass.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9" fill="none" stroke="#a74624" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect width="720" height="270" rx="12" fill="#fafafa"/>
  <g fill="#fff" stroke="#d4d4d4" stroke-width="2">
    <rect x="24" y="52" width="168" height="94" rx="8"/>
    <rect x="276" y="52" width="168" height="94" rx="8"/>
    <rect x="528" y="52" width="168" height="94" rx="8"/>
  </g>
  <g fill="#242424" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <text x="108" y="94" font-size="22" font-weight="600">Input</text>
    <text x="108" y="120" font-size="17">representations</text>
    <text x="360" y="94" font-size="22" font-weight="600">AlphaFold 2</text>
    <text x="360" y="120" font-size="17">same weights</text>
    <text x="612" y="94" font-size="22" font-weight="600">Output</text>
    <text x="612" y="120" font-size="17">structure + state</text>
  </g>
  <g fill="none" stroke="#a74624" stroke-width="3" marker-end="url(#arrow)">
    <path d="M195 99 H267"/>
    <path d="M447 99 H519"/>
    <path d="M612 150 V215 H108 V154"/>
  </g>
  <text x="360" y="205" fill="#8f3414" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Recycle for another pass</text>
</svg>
